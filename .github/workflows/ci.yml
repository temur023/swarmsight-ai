name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ffmpeg (clips are written as H.264)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1
      - name: Tests
        run: python -m pytest -q
        env:
          SWARMSIGHT_DEVICE: cpu
